<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator Link Tamu Undangan</title>
    <link rel="stylesheet" href="./dist/output.css" />
    <style>
      /* Fallback styling jika dibuka terpisah dari dist/output.css */
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-ivory-dark px-4 py-10 text-[#2C2C2C]">
    <div class="mx-auto max-w-2xl">
      <!-- Header -->
      <div class="mb-8 text-center">
        <span
          class="inline-block rounded-full bg-gold/15 px-3 py-1 text-xs font-semibold tracking-wider text-[#9E7B36] uppercase"
        >
          Tools Klien
        </span>
        <h1 class="mt-2 font-serif text-3xl font-bold text-[#9E7B36]">
          Generator Nama Tamu
        </h1>
        <p class="mt-1 text-xs text-neutral-600">
          Buat link undangan khusus beserta kata pengantar WhatsApp untuk setiap
          tamu secara otomatis.
        </p>
      </div>

      <!-- Form Pengaturan -->
      <div
        class="space-y-5 rounded-2xl border border-gold/40 bg-ivory p-6 shadow-sm"
      >
        <!-- 1. URL Undangan -->
        <div>
          <label
            for="input-url"
            class="block text-xs font-semibold text-neutral-700"
          >
            1. Link Utama Undangan Klien
          </label>
          <input
            type="url"
            id="input-url"
            placeholder="https://sejolyinvitation.com/ahmad-fatimah/"
            class="mt-1.5 w-full rounded-xl border border-gold/50 bg-white px-3.5 py-2.5 text-sm focus:border-gold focus:outline-none"
          />
          <p class="mt-1 text-[11px] text-neutral-500">
            Pastikan link diawali <code>https://</code> dan mengarah ke halaman
            undangan klien.
          </p>
        </div>

        <!-- 2. Nama Mempelai (Untuk Teks Pengantar WA) -->
        <div>
          <label
            for="input-mempelai"
            class="block text-xs font-semibold text-neutral-700"
          >
            2. Nama Panggilan Mempelai
          </label>
          <input
            type="text"
            id="input-mempelai"
            placeholder="Contoh: Ahmad & Fatimah"
            class="mt-1.5 w-full rounded-xl border border-gold/50 bg-white px-3.5 py-2.5 text-sm focus:border-gold focus:outline-none"
          />
        </div>

        <!-- 3. Pilihan Template Kata Pengantar -->
        <div>
          <label
            for="pilih-template"
            class="block text-xs font-semibold text-neutral-700"
          >
            3. Template Kata Pengantar WhatsApp
          </label>
          <select
            id="pilih-template"
            class="mt-1.5 w-full rounded-xl border border-gold/50 bg-white px-3.5 py-2.5 text-sm focus:border-gold focus:outline-none"
          >
            <option value="islami">Islami (Assalamu'alaikum Wr. Wb.)</option>
            <option value="formal">Formal / Nasional (Kepada Yth.)</option>
            <option value="kasual">Santai / Teman Dekat</option>
            <option value="link-saja">
              Hanya Link Undangan (Tanpa Teks Pengantar)
            </option>
          </select>
        </div>

        <!-- 4. Daftar Nama Tamu -->
        <div>
          <div class="flex items-center justify-between">
            <label
              for="input-tamu"
              class="block text-xs font-semibold text-neutral-700"
            >
              4. Daftar Nama Tamu (Pisahkan dengan Enter / Baris Baru)
            </label>
            <span
              id="jumlah-tamu"
              class="text-[11px] font-medium text-[#9E7B36]"
              >0 Tamu</span
            >
          </div>
          <textarea
            id="input-tamu"
            rows="6"
            placeholder="Budi Santoso & Partner&#10;Keluarga Besar Bpk. Hendra&#10;Siti Aminah, S.Pd."
            class="mt-1.5 w-full rounded-xl border border-gold/50 bg-white p-3.5 text-sm leading-relaxed focus:border-gold focus:outline-none"
          ></textarea>
        </div>

        <!-- Tombol Generate -->
        <div class="flex flex-col gap-2.5 pt-1 sm:flex-row">
          <button
            type="button"
            id="btn-generate"
            class="flex-1 rounded-xl bg-gold px-5 py-3 text-xs font-semibold tracking-wider text-white uppercase shadow-sm transition hover:bg-[#9E7B36] active:scale-95"
          >
            Buat Daftar Link Tamu
          </button>
          <button
            type="button"
            id="btn-reset"
            class="rounded-xl border border-neutral-300 bg-white px-4 py-3 text-xs font-medium text-neutral-600 transition hover:bg-neutral-100"
          >
            Reset
          </button>
        </div>
      </div>

      <!-- Hasil Daftar Tamu -->
      <div id="wadah-hasil" class="mt-8 hidden">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="font-serif text-xl font-bold text-[#9E7B36]">
            Hasil Link Undangan
          </h2>
          <button
            type="button"
            id="btn-copy-semua"
            class="rounded-lg border border-gold bg-white px-3 py-1.5 text-xs font-medium text-[#9E7B36] transition hover:bg-gold hover:text-white"
          >
            Salin Semua Link
          </button>
        </div>

        <div id="list-hasil" class="space-y-3"></div>
      </div>
    </div>

    <script>
      const inputUrl = document.getElementById("input-url");
      const inputMempelai = document.getElementById("input-mempelai");
      const pilihTemplate = document.getElementById("pilih-template");
      const inputTamu = document.getElementById("input-tamu");
      const jumlahTamu = document.getElementById("jumlah-tamu");
      const btnGenerate = document.getElementById("btn-generate");
      const btnReset = document.getElementById("btn-reset");
      const wadahHasil = document.getElementById("wadah-hasil");
      const listHasil = document.getElementById("list-hasil");
      const btnCopySemua = document.getElementById("btn-copy-semua");

      // 1. Otomatis isi URL & Mempelai jika dibuka lewat parameter ?url=...&mempelai=...
      const params = new URLSearchParams(window.location.search);
      if (params.get("url")) {
        inputUrl.value = params.get("url");
      } else if (localStorage.getItem("sejoly_gen_url")) {
        inputUrl.value = localStorage.getItem("sejoly_gen_url");
      }

      if (params.get("mempelai")) {
        inputMempelai.value = params.get("mempelai");
      } else if (localStorage.getItem("sejoly_gen_mempelai")) {
        inputMempelai.value = localStorage.getItem("sejoly_gen_mempelai");
      }

      // Hitung jumlah baris tamu secara real-time
      inputTamu.addEventListener("input", () => {
        const baris = inputTamu.value
          .split("\n")
          .map((t) => t.trim())
          .filter(Boolean);
        jumlahTamu.textContent = `${baris.length} Tamu`;
      });

      // Susun pesan WhatsApp berdasarkan template
      function buatPesanWA(namaTamu, linkLengkap, mempelai, jenisTemplate) {
        const namaPasangan = mempelai || "Kami yang Berbahagia";

        if (jenisTemplate === "link-saja") {
          return linkLengkap;
        }

        if (jenisTemplate === "formal") {
          return `Kepada Yth.\nBapak/Ibu/Saudara/i *${namaTamu}*\n\nTanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami:\n\n*${namaPasangan}*\n\nBerikut link undangan resmi kami untuk informasi lengkap mengenai waktu dan lokasi acara:\n${linkLengkap}\n\nMerupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.\n\nTerima kasih.`;
        }

        if (jenisTemplate === "kasual") {
          return `Halo *${namaTamu}*! 👋\n\nKami mau ngabarin kabar bahagia nih. Kami (*${namaPasangan}*) akan segera melangsungkan pernikahan dan pengen banget kamu bisa hadir di hari spesial kami.\n\nDetail acara & lokasi lengkapnya bisa cek di undangan digital ini ya:\n${linkLengkap}\n\nDitunggu kehadirannya! 🙏✨`;
        }

        // Default: Islami
        return `Assalamu'alaikum Wr. Wb.\n\nKepada Yth.\nBapak/Ibu/Saudara/i *${namaTamu}*\n\nTanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami:\n\n*${namaPasangan}*\n\nInformasi lengkap mengenai waktu dan lokasi acara dapat diakses melalui tautan berikut:\n${linkLengkap}\n\nMerupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan doa restu.\n\nWassalamu'alaikum Wr. Wb.`;
      }

      // Proses Generate
      btnGenerate.addEventListener("click", () => {
        let baseUrl = inputUrl.value.trim();
        const mempelai = inputMempelai.value.trim();
        const jenisTemplate = pilihTemplate.value;
        const daftarNama = inputTamu.value
          .split("\n")
          .map((t) => t.trim())
          .filter(Boolean);

        if (!baseUrl) {
          alert("Silakan masukkan Link Utama Undangan Klien terlebih dahulu.");
          inputUrl.focus();
          return;
        }

        if (daftarNama.length === 0) {
          alert("Silakan masukkan minimal satu nama tamu.");
          inputTamu.focus();
          return;
        }

        // Tambahkan https:// otomatis jika klien lupa mengetiknya
        if (!/^https?:\/\//i.test(baseUrl)) {
          baseUrl = "https://" + baseUrl;
          inputUrl.value = baseUrl;
        }

        // Simpan ke localStorage agar klien tidak perlu ketik ulang jika halaman tertutup
        localStorage.setItem("sejoly_gen_url", baseUrl);
        localStorage.setItem("sejoly_gen_mempelai", mempelai);

        listHasil.innerHTML = "";
        const semuaLink = [];

        daftarNama.forEach((nama) => {
          // Bangun URL aman dengan URLSearchParams agar karakter &, spasi, gelar tidak merusak link
          const urlObj = new URL(baseUrl);
          urlObj.searchParams.set("to", nama);
          const linkFinal = urlObj.toString();
          semuaLink.push(`${nama}: ${linkFinal}`);

          const teksWA = buatPesanWA(nama, linkFinal, mempelai, jenisTemplate);
          const waHref = `https://api.whatsapp.com/send?text=${encodeURIComponent(teksWA)}`;

          const card = document.createElement("div");
          card.className =
            "flex flex-col justify-between gap-3 rounded-xl border border-gold/35 bg-[#FFFFF0] p-4 shadow-xs sm:flex-row sm:items-center";

          card.innerHTML = `
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-bold text-[#2C2C2C]">${nama}</p>
            <p class="mt-0.5 truncate font-mono text-[11px] text-[#9E7B36]">${linkFinal}</p>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <button type="button" class="btn-salin-pesan rounded-lg border border-gold/50 bg-white px-3 py-2 text-xs font-medium text-[#2C2C2C] transition hover:bg-neutral-100">
              Salin Teks
            </button>
            <a href="${waHref}" target="_blank" rel="noopener noreferrer" class="rounded-lg bg-emerald-600 px-3.5 py-2 text-xs font-semibold text-white transition hover:bg-emerald-700">
              Kirim WA
            </a>
          </div>
        `;

          // Event tombol salin teks pengantar + link
          const btnSalin = card.querySelector(".btn-salin-pesan");
          btnSalin.addEventListener("click", async () => {
            await navigator.clipboard.writeText(teksWA);
            const asli = btnSalin.textContent;
            btnSalin.textContent = "✓ Tersalin";
            btnSalin.classList.add(
              "bg-emerald-50",
              "text-emerald-700",
              "border-emerald-400",
            );
            setTimeout(() => {
              btnSalin.textContent = asli;
              btnSalin.classList.remove(
                "bg-emerald-50",
                "text-emerald-700",
                "border-emerald-400",
              );
            }, 1800);
          });

          listHasil.appendChild(card);
        });

        // Simpan kumpulan link untuk tombol Salin Semua
        btnCopySemua.dataset.allLinks = semuaLink.join("\n");
        wadahHasil.classList.remove("hidden");
        wadahHasil.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      // Salin Semua Link
      btnCopySemua.addEventListener("click", async () => {
        const data = btnCopySemua.dataset.allLinks || "";
        if (!data) return;
        await navigator.clipboard.writeText(data);
        const asli = btnCopySemua.textContent;
        btnCopySemua.textContent = "✓ Semua Link Tersalin";
        setTimeout(() => {
          btnCopySemua.textContent = asli;
        }, 2000);
      });

      // Reset Form
      btnReset.addEventListener("click", () => {
        inputTamu.value = "";
        jumlahTamu.textContent = "0 Tamu";
        listHasil.innerHTML = "";
        wadahHasil.classList.add("hidden");
      });
    </script>
  </body>
</html>
